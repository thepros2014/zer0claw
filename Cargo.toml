
[workspace]
members = [
    "zeroclaw-api",
    "zeroclaw-solana",
    "zeroclaw-memory",
    "zeroclaw-cli",
    "zeroclaw-provider",
    "zeroclaw-openai",
    "zeroclaw-ollama",
    "zeroclaw-llamacpp",
    "zeroclaw-accounting",
]
resolver = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
unwrap_used = "warn"
expect_used = "warn"
