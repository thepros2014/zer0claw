<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZeroClaw Commerce — Merchant Setup & Channel Wizard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #090D16;
            --panel-bg: rgba(18, 24, 38, 0.85);
            --panel-border: rgba(255, 255, 255, 0.1);
            --solana-green: #14F195;
            --solana-purple: #9945FF;
            --text-primary: #FFFFFF;
            --text-secondary: #94A3B8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(153, 69, 255, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 50% 80%, rgba(20, 241, 149, 0.1) 0%, transparent 50%);
        }

        .setup-card {
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--panel-border);
            border-radius: 20px;
            padding: 2.5rem;
            width: 100%;
            max-width: 680px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .header { text-align: center; margin-bottom: 2rem; }
        .header-icon {
            width: 56px; height: 56px;
            background: linear-gradient(135deg, var(--solana-purple), var(--solana-green));
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem; margin: 0 auto 1rem auto;
            box-shadow: 0 0 30px rgba(153, 69, 255, 0.4);
        }
        .title { font-size: 1.6rem; font-weight: 800; margin-bottom: 0.4rem; }
        .subtitle { color: var(--text-secondary); font-size: 0.9rem; }

        .form-group { margin-bottom: 1.25rem; }
        label {
            display: block; font-size: 0.825rem; font-weight: 600;
            color: var(--text-secondary); margin-bottom: 0.4rem;
            text-transform: uppercase; letter-spacing: 0.05em;
        }

        input[type="text"], input[type="number"], input[type="password"], select {
            width: 100%; background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--panel-border); border-radius: 10px;
            padding: 0.85rem 1rem; color: white; font-size: 0.95rem;
            font-family: inherit; transition: border-color 0.2s;
        }

        input:focus, select:focus {
            outline: none; border-color: var(--solana-green);
            box-shadow: 0 0 10px rgba(20, 241, 149, 0.2);
        }

        .channel-block {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--panel-border);
            border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem;
        }

        .channel-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 0.75rem;
        }

        .channel-title { font-weight: 700; font-size: 0.95rem; }

        .mode-select {
            background: rgba(0, 0, 0, 0.4); color: var(--solana-green);
            border: 1px solid var(--panel-border); border-radius: 6px;
            padding: 0.35rem 0.7rem; font-size: 0.8rem; font-weight: 600;
        }

        .btn-submit {
            width: 100%; background: linear-gradient(135deg, var(--solana-purple), #7C3AED);
            color: white; border: none; padding: 1rem; border-radius: 12px;
            font-size: 1rem; font-weight: 700; cursor: pointer;
            transition: transform 0.2s, opacity 0.2s; margin-top: 1rem;
        }
        .btn-submit:hover { opacity: 0.95; transform: translateY(-1px); }

        .alert-success {
            display: none; background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3); color: #10B981;
            padding: 1rem; border-radius: 10px; font-size: 0.9rem;
            text-align: center; margin-top: 1rem;
        }
    </style>
</head>
<body>

    <div class="setup-card">
        <div class="header">
            <div class="header-icon">🛡️</div>
            <h1 class="title">ZeroClaw Commerce</h1>
            <p class="subtitle">First-Time Setup & Per-Channel Configuration Wizard</p>
        </div>

        <form id="setup-form">
            <div class="form-group">
                <label for="store_name">Merchant Store Name</label>
                <input type="text" id="store_name" value="Solana Dev Academy Store" required>
            </div>

            <div class="form-group">
                <label for="merchant_wallet">Solana Receiving Wallet Address</label>
                <input type="text" id="merchant_wallet" value="DestWallet11111111111111111111111111111111" required>
            </div>

            <!-- Admin PIN Setup -->
            <div class="form-group">
                <label for="admin_pin">Create 6-Digit Admin Security PIN</label>
                <input type="password" id="admin_pin" value="123456" maxlength="6" pattern="\d{6}" required>
                <p style="font-size:0.75rem; color: var(--text-secondary); margin-top: 0.25rem;">Required to unlock Tax CSV exports & Admin controls in the dashboard.</p>
            </div>

            <!-- Channel 1: Telegram -->
            <div class="channel-block">
                <div class="channel-header">
                    <span class="channel-title">🤖 Telegram Storefront Bot</span>
                    <select id="mode_telegram" class="mode-select" onchange="toggleChannel('telegram')">
                        <option value="configure">⚙️ Configure Now</option>
                        <option value="skip">⏭️ Skip for Later</option>
                    </select>
                </div>
                <div id="fields_telegram">
                    <input type="password" id="token_telegram" placeholder="Telegram Token (from @BotFather)">
                </div>
            </div>

            <!-- Channel 2: Discord -->
            <div class="channel-block">
                <div class="channel-header">
                    <span class="channel-title">🎮 Discord Slash Bot</span>
                    <select id="mode_discord" class="mode-select" onchange="toggleChannel('discord')">
                        <option value="configure">⚙️ Configure Now</option>
                        <option value="skip" selected>⏭️ Skip for Later</option>
                    </select>
                </div>
                <div id="fields_discord" style="display: none;">
                    <input type="password" id="token_discord" placeholder="Discord Bot Token">
                </div>
            </div>

            <!-- Channel 3: WhatsApp -->
            <div class="channel-block">
                <div class="channel-header">
                    <span class="channel-title">📱 WhatsApp Cloud API Webhook</span>
                    <select id="mode_whatsapp" class="mode-select" onchange="toggleChannel('whatsapp')">
                        <option value="configure">⚙️ Configure Now</option>
                        <option value="skip" selected>⏭️ Skip for Later</option>
                    </select>
                </div>
                <div id="fields_whatsapp" style="display: none;">
                    <input type="text" id="token_whatsapp" placeholder="WhatsApp Verify Token" value="solona_secure_verify_token">
                </div>
            </div>

            <button type="submit" class="btn-submit">
                🚀 Save Setup & Open Dashboard
            </button>
        </form>

        <div class="alert-success" id="success-alert">
            ✅ <b>Configuration Saved!</b><br>
            Redirecting to Sales & Security Dashboard...
        </div>
    </div>

    <script>
        function toggleChannel(ch) {
            const mode = document.getElementById(`mode_${ch}`).value;
            document.getElementById(`fields_${ch}`).style.display = (mode === 'configure') ? 'block' : 'none';
        }

        document.getElementById('setup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                store_name: document.getElementById('store_name').value,
                merchant_wallet: document.getElementById('merchant_wallet').value,
                admin_pin: document.getElementById('admin_pin').value,
                channels: {
                    telegram: document.getElementById('mode_telegram').value,
                    discord: document.getElementById('mode_discord').value,
                    whatsapp: document.getElementById('mode_whatsapp').value,
                }
            };

            try {
                const res = await fetch('/api/v1/setup/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (res.ok) {
                    document.getElementById('setup-form').style.display = 'none';
                    document.getElementById('success-alert').style.display = 'block';
                    setTimeout(() => { window.location.href = '/dashboard'; }, 1200);
                }
            } catch (err) {
                window.location.href = '/dashboard';
            }
        });
    </script>
</body>
</html>
