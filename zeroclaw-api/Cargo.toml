[package]
name = "zeroclaw-api"
version = "0.1.0"
edition = "2021"
description = "Kernel API traits for the ZeroClaw AI Framework"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
rand = "0.10.2"
