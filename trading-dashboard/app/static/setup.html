<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kraken AI Margin Trading — Configuration Wizard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #090D16;
            --panel-bg: rgba(18, 24, 38, 0.85);
            --panel-border: rgba(255, 255, 255, 0.1);
            --ai-blue: #3A86FF;
            --ai-purple: #8338EC;
            --text-primary: #FFFFFF;
            --text-secondary: #94A3B8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(131, 56, 236, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 50% 80%, rgba(58, 134, 255, 0.1) 0%, transparent 50%);
        }

        .setup-card {
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--panel-border);
            border-radius: 20px;
            padding: 2.5rem;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .header { text-align: center; margin-bottom: 2rem; }
        .header-icon {
            width: 56px; height: 56px;
            background: linear-gradient(135deg, var(--ai-purple), var(--ai-blue));
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem; margin: 0 auto 1rem auto;
            box-shadow: 0 0 30px rgba(131, 56, 236, 0.4);
        }
        .title { font-size: 1.6rem; font-weight: 800; margin-bottom: 0.4rem; }
        .subtitle { color: var(--text-secondary); font-size: 0.9rem; }

        .form-group { margin-bottom: 1.25rem; }
        label {
            display: block; font-size: 0.825rem; font-weight: 600;
            color: var(--text-secondary); margin-bottom: 0.4rem;
            text-transform: uppercase; letter-spacing: 0.05em;
        }

        input[type="text"], input[type="password"], select {
            width: 100%; background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--panel-border); border-radius: 10px;
            padding: 0.85rem 1rem; color: white; font-size: 0.95rem;
            font-family: inherit; transition: border-color 0.2s;
        }

        input:focus, select:focus {
            outline: none; border-color: var(--ai-blue);
            box-shadow: 0 0 10px rgba(58, 134, 255, 0.2);
        }

        .btn-submit {
            width: 100%; background: linear-gradient(135deg, var(--ai-purple), var(--ai-blue));
            color: white; border: none; padding: 1rem; border-radius: 12px;
            font-size: 1rem; font-weight: 700; cursor: pointer;
            transition: transform 0.2s, opacity 0.2s; margin-top: 1rem;
        }
        .btn-submit:hover { opacity: 0.95; transform: translateY(-1px); }

        .alert-success {
            display: none; background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3); color: #10B981;
            padding: 1rem; border-radius: 10px; font-size: 0.9rem;
            text-align: center; margin-top: 1rem;
        }
    </style>
</head>
<body>

    <div class="setup-card">
        <div class="header">
            <div class="header-icon">🐙</div>
            <h1 class="title">Kraken AI Margin Trading</h1>
            <p class="subtitle">Initial Configuration & Authentication</p>
        </div>

        <form id="setup-form">
            <!-- Kraken API Keys -->
            <div class="form-group">
                <label for="kraken_api_key">Kraken API Key</label>
                <input type="password" id="kraken_api_key" placeholder="Enter your Kraken API Key" required>
            </div>
            <div class="form-group">
                <label for="kraken_api_secret">Kraken API Secret</label>
                <input type="password" id="kraken_api_secret" placeholder="Enter your Kraken API Secret" required>
            </div>

            <div style="display:flex; gap:10px; margin-bottom: 1.25rem;">
                <!-- Leverage -->
                <div style="flex:1;">
                    <label for="kraken_max_leverage">Max Leverage Limit</label>
                    <select id="kraken_max_leverage">
                        <option value="1">No Margin (Spot Only)</option>
                        <option value="2">Max Leverage: 2x</option>
                        <option value="3">Max Leverage: 3x</option>
                        <option value="5">Max Leverage: 5x</option>
                        <option value="10" selected>Max Leverage: 10x</option>
                    </select>
                </div>
                <!-- Trading Pair -->
                <div style="flex:1;">
                    <label for="kraken_trading_pair">Target Trading Pair</label>
                    <input type="text" id="kraken_trading_pair" placeholder="e.g. BTC/USD" value="BTC/USD" required>
                </div>
            </div>
            
            <div class="form-group">
                <label for="admin_pin">Admin Security PIN</label>
                <input type="password" id="admin_pin" value="123456" maxlength="6" pattern="\d{6}" required>
                <p style="font-size:0.75rem; color: var(--text-secondary); margin-top: 0.25rem;">Required to unlock Dashboard settings.</p>
            </div>

            <button type="submit" class="btn-submit">
                🚀 Save Setup & Open AI Dashboard
            </button>
        </form>

        <div class="alert-success" id="success-alert">
            ✅ <b>Configuration Saved!</b><br>
            Redirecting to AI Dashboard...
        </div>
    </div>

    <script>
        // Auto-fill existing config if available
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetch('/api/v1/setup/status');
                const data = await res.json();
                if (data.config) {
                    if (data.config.kraken_api_key) document.getElementById('kraken_api_key').value = data.config.kraken_api_key;
                    if (data.config.kraken_max_leverage) document.getElementById('kraken_max_leverage').value = data.config.kraken_max_leverage;
                    if (data.config.kraken_trading_pair) document.getElementById('kraken_trading_pair').value = data.config.kraken_trading_pair;
                }
            } catch (e) {}
        });

        document.getElementById('setup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                admin_pin: document.getElementById('admin_pin').value,
                kraken_api_key: document.getElementById('kraken_api_key').value,
                kraken_api_secret: document.getElementById('kraken_api_secret').value,
                kraken_max_leverage: document.getElementById('kraken_max_leverage').value,
                kraken_trading_pair: document.getElementById('kraken_trading_pair').value
            };

            try {
                const res = await fetch('/api/v1/setup/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (res.ok) {
                    localStorage.setItem('setup_completed', 'true');
                    document.getElementById('setup-form').style.display = 'none';
                    document.getElementById('success-alert').style.display = 'block';
                    setTimeout(() => { window.location.href = '/dashboard'; }, 1200);
                }
            } catch (err) {
                localStorage.setItem('setup_completed', 'true');
                window.location.href = '/dashboard';
            }
        });
    </script>
</body>
</html>
